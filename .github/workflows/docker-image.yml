name: Kubernetes CI

on:
  push:
    branches:
      - main

jobs:
  pyapp-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t zchege/gha-pyapp:${GITHUB_SHA::7} .

      - name: Push Docker Image
        run: docker push zchege/gha-pyapp:${GITHUB_SHA::7}

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Update deployment.yml with latest Docker tag
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          yq -i '.spec.template.spec.containers[0].image = "zchege/gha-pyapp:'"$SHORT_SHA"'"' k8s/pyapp-deployment.yaml

      - name: Commit deployment file changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/pyapp-deployment.yaml
          git commit -m "ci: update image tag [skip ci]" || echo "No changes to commit"

      - name: Push changes
        run: git push
